<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logowanie - BikeAI</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='common_auth.css') }}">

        <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>

    <div class="page">

        <h2 class="logo">BIKE AI</h2>

        <div class="box">

            <h1>LOGOWANIE</h1>

            <form method="POST" action="{{ url_for('login_route') }}">

                <input
                    type="text"
                    name="login"
                    placeholder="Adres e-mail lub login"
                    required
                >
                <input
                    type="password"
                    name="password"
                    placeholder="Hasło"
                    required
                >
                {% if error %}
                    <div class="error">
                        {{ error }}
                    </div>
                {% endif %}

                <button
                    type="submit"
                >
                    ZALOGUJ SIĘ
                </button>
            </form>
        </div>
    </div>
</body>
</html>
